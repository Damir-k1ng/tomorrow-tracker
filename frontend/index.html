<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Telegram Mini App requirements:
      - viewport-fit=cover exposes env(safe-area-inset-*) for notch/home-bar.
      - user-scalable=no keeps the WebView from pinch-zooming the UI.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Tomorrow Tracker</title>

    <!--
      Official Telegram WebApp SDK. Loaded synchronously in <head> so
      window.Telegram.WebApp exists before the app's JS runs. The app NEVER
      touches this global directly — only src/telegram/sdk.ts does.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
